<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculadora</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label for="numero1">Primer número</label>
    <input type="number" id="numero1">

    <label for="numero2">Segundo número</label>
    <input type="number" id="numero2">

    <button id="suma">+</button>
    <button id="resta">-</button>
    <button id="multiplicacion">x</button>
    <button id="division">÷</button>
    <button id="raiz">√</button>
    <button id="potencia">^</button>
    <button id="absoluto">|x|</button>
    <button id="random">random</button>
    <button id="redondeo">round</button>
    <button id="floor">floor</button>
    <button id="ceil">ceil</button>

    <h3 id="resultado"></h3>
    
</body>
</html>
